[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagents-example"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.15",
    "langchain-openai>=1,<2",
    "langchain-mcp-adapters==0.3.2",
]

[tool.setuptools]
py-modules = ["agent"]
